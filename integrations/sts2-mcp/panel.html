<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>杀戮尖塔 2 · DeepSeek</title>
<style>
body{margin:0;background:#131918;color:#e5eee7;font:16px/1.65 system-ui,sans-serif}main{max-width:920px;margin:60px auto;padding:0 24px}h1{font-size:32px}small{color:#a8bbae}button,input{font:inherit;border:1px solid #527462;border-radius:6px;padding:9px 14px;background:#233a30;color:inherit}button{cursor:pointer;margin:6px 8px 6px 0}input[type=number]{width:90px}input[type=text]{width:min(95%,650px)}pre{background:#0c1210;border:1px solid #334d3d;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px}#error{color:#ffb3a6}
</style><main>
<small>AI VTUBER / GAME CONTROL</small><h1>杀戮尖塔 2 · DeepSeek</h1>
<p>由 DeepSeek 规划，通过 STS2MCP 操作真实游戏。</p>
<p><a href="http://127.0.0.1:3000/games.html?game=sts2" style="color:#e1cb8f">进入统一游戏工作台：我的世界 / 杀戮尖塔 2</a></p>
<p><label>目标 <input id="goal" type="text" value="完成当前单人冒险，合理规划并争取胜利"></label></p>
<p><label>本次最多决策次数 <input id="steps" type="number" min="1" max="500" value="100"></label></p>
<button id="probe">检查连接</button><button id="start">开始游玩</button><button id="stop">停止</button><button id="state">读取游戏状态</button>
<p id="error" role="alert"></p><h2>运行状态</h2><pre id="status">正在连接…</pre><h2>游戏状态 / 检查结果</h2><pre id="game">尚未读取</pre>
<script>
const $=id=>document.getElementById(id);
async function request(url,data){const r=await fetch(url,data===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const body=await r.json();if(!r.ok)throw Error(body.error||r.status);return body}
async function refresh(){try{$('status').textContent=JSON.stringify(await request('/api/status'),null,2)}catch(e){$('error').textContent=e.message}}
async function action(url,data){$('error').textContent='';try{$('game').textContent=JSON.stringify(await request(url,data),null,2);await refresh()}catch(e){$('error').textContent=e.message}}
$('start').onclick=()=>action('/api/start',{steps:Number($('steps').value),goal:$('goal').value});
$('stop').onclick=()=>action('/api/stop',{});$('probe').onclick=()=>action('/api/probe',{});$('state').onclick=()=>action('/api/state');
refresh();setInterval(refresh,2000);
</script></main></html>
