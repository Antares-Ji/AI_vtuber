[project]
name = "avatar-pipeline"
version = "0.1.0"
description = "Automated Outfit Design -> Layered Illustration (PNG/PSD) -> Auto-Rigged Open 2D Avatar Pipeline for AI_vtuber"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "opencv-python-headless>=4.9.0",
    "psd-tools>=1.9.30",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
