plugins { id 'java-library'; id 'application' }
if (rootProject == project) {
    def release = new Properties()
    file('../../gradle.properties').withInputStream { release.load(it) }
    allprojects { group = 'dev.mcplayeragent'; version = release.getProperty('agent_version') }
}
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(Test).configureEach { useJUnitPlatform() }
application { mainClass = 'example.collectreturn.ExampleMain' }
dependencies {
    implementation project(':harness')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('jar', Jar) {
    from(projectDir.toPath().resolve('../..').toFile()) { include 'LICENSE', 'COPYING', 'NOTICE' }
}
