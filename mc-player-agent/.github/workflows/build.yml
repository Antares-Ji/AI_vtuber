name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check repository boundaries and documentation
        run: python tools/check_repository.py
      - name: Test repository and packaging tools
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Test independent harness and simulated execution
        run: bash gradlew -p harness :test :installDist :run --args='demo build/demo' --no-daemon
      - name: Test external extension and its simulated execution
        run: bash gradlew -p examples/collect-return :test :run --args='build/demo' --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-verification
          path: |
            harness/build/reports/tests/test/
            harness/build/demo/
            examples/collect-return/build/reports/tests/test/
            examples/collect-return/build/demo/
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build both loaders
        shell: pwsh
        run: .\gradlew.bat :harness:test :collect-return-example:test :fabric:build :neoforge:build --no-daemon
      - name: NeoForge native GameTests
        shell: pwsh
        run: .\gradlew.bat :neoforge:runGameTestServer --no-daemon
      - name: Fabric native GameTests
        shell: pwsh
        run: .\gradlew.bat :fabric:runGameTestServer --no-daemon
      - name: Package matching source and binaries
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-packages
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-verification
          path: |
            harness/build/reports/tests/test/
            fabric/runs/gametestserver/logs/latest.log
            neoforge/runs/gametestserver/logs/latest.log
