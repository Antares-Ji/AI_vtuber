<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主界面交互候选框校对</title>
<style>
body{margin:0;background:#111827;color:#eee;font:14px system-ui}header{padding:14px}main{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:12px;padding:12px}.stage{position:relative;align-self:start}.stage img{width:100%;display:block}.box{position:absolute;border:2px solid #35ff9a;box-sizing:border-box;cursor:move;touch-action:none;background:transparent}.box.uncertain{border-color:#ffce50;border-style:dashed}.box.selected{border-color:#fff;box-shadow:0 0 0 2px #1b64ff}.tag{position:absolute;top:0;left:0;background:#073921;color:white;padding:1px 4px;font-weight:bold;font-size:12px}.uncertain .tag{background:#715300}.handle{position:absolute;bottom:-4px;right:-4px;background:white;width:12px;height:12px;cursor:nwse-resize}aside{max-height:82vh;overflow:auto}button,input{font:inherit;margin:3px;padding:5px}input[type=number]{width:62px}#name{width:245px}#list button{display:block;width:96%;text-align:left}button{cursor:pointer}p{line-height:1.5;margin:6px 0} .hint{color:#ffce50}@media(max-width:850px){main{grid-template-columns:1fr}aside{max-height:none}}</style>
<header><h2>主界面：用户校正版 · 25 个区域</h2><p>默认加载你导出的校正版。绿框＝已保留的交互区域；黄虚线＝不确定项。人工标注不等于实际点击验证。系统标题栏不标，框允许重叠。</p><p>点框或右侧编号选中；拖框移动，拖右下角调整大小。更改保存在此浏览器，完成后导出 JSON 给我。</p></header>
<main><div class="stage" id="stage"><img src="home-reference-20260907.jpg" alt="用户保存的明日方舟主界面原图"><div id="boxes"></div></div>
<aside><p id="selected">选择一个框</p><input id="name" aria-label="区域名称"><div id="coords"></div><label><input id="uncertain" type="checkbox">不确定</label>
<p class="hint">逐页验收：从主界面1号“设置”开始。进入后保存截图，助手框选，你修正；层级关系由助手记录，无需批量填写。</p>
<p><button id="remove">删除选中框</button><button id="add">添加漏框</button></p><p><button id="export">导出标注 JSON</button></p><p id="status" class="hint"></p><div id="list"></div></aside></main><script type="module" src="home-editor.js"></script></html>
