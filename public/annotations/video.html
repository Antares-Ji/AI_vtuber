<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置录像 · 关键页面精修</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#e2e8f0;font:14px system-ui}header{padding:16px 24px;background:#192436}h1{font-size:22px;margin:0 0 8px}a{color:#8dccff}button,input,textarea,select{font:inherit;border-radius:5px;border:1px solid #536479;background:#202e40;color:#fff;padding:7px}button{cursor:pointer}button.active{background:#196255}button:hover{border-color:#78e4c3}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:0 24px 24px}.stage{position:relative;align-self:start}.stage img{width:100%;display:block}.box{position:absolute;border:2px solid #f3c46f;cursor:move;touch-action:none}.box.text{border-color:#779ec9}.box.selected{border-color:#fff;box-shadow:0 0 0 2px #21ba92}.box b{position:absolute;top:0;left:0;background:#142235;color:white;font-size:12px;max-width:160px;white-space:nowrap;overflow:hidden}.handle{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;background:#fff;cursor:nwse-resize}aside{position:sticky;top:8px;align-self:start;max-height:95vh;overflow:auto;background:#192436;padding:14px}label{display:block;margin:9px 0}label input:not([type=checkbox]),label textarea,label select{width:100%}.coord{width:66px}#box-list button{display:block;width:100%;text-align:left;margin-top:5px}details{margin:12px 24px;padding:12px;background:#192436}#flow>div{padding:8px;border-bottom:1px solid #536479}#flow input{width:190px;margin:5px}#events{max-height:350px;overflow:auto}.muted{color:#b2c4d9}#frame-image{max-width:100%;max-height:65vh}#status{color:#ffe0a0}#save-state{color:#8ce6c5}@media(max-width:850px){main{grid-template-columns:1fr}aside{position:relative;max-height:none}}
</style>
<header><h1>设置录像 · 关键页面精修</h1><div id="summary">正在读取分析结果…</div><p id="status"></p><p id="save-state">修改只保存在当前浏览器；请导出 JSON 备份。</p><button id="export">导出全部修改 JSON</button> <label style="display:inline">导入修改 <input type="file" id="import" accept="application/json" style="width:220px"></label> <a href="/vision.html">返回视觉采集</a></header>
<nav id="pages" aria-label="关键页面"></nav>
<details open><summary>入口层级与逻辑联系（可修改，尚未人工确认）</summary><p>主界面 → 设置 → 左侧入口 → 对应关键图。用户中心：未确认进入，不生成虚构页面。</p><div id="flow"></div></details>
<main><section><h2 id="title"></h2><p id="coverage" class="muted"></p><label><input type="checkbox" id="show-text">显示文字区域框（默认只显示控件候选）</label><div class="stage" id="stage"><img id="page-image" alt="关键页面"><div id="boxes"></div></div></section><aside><h3>逐框精修</h3><p id="selected">点击图中的框或下方列表</p><label>名称<input id="name"></label><label>注释<textarea id="note" rows="3"></textarea></label><label>类型<select id="kind"><option>文字</option><option>按钮候选</option><option>滑条候选</option><option>开关</option><option>按钮</option><option>滑条</option><option>装饰</option></select></label><label>跳转到页面／状态<input id="target" list="targets"></label><datalist id="targets"></datalist><div id="coords"></div><label><input type="checkbox" id="verified">此框已由我确认</label><button id="add">补框</button> <button id="remove">删除选中框</button><div id="box-list"></div></aside></main>
<details><summary>动作证据与拼接来源</summary><p>滚动依据连续位移识别；点击依据入口附近指针和切页推断。录像不包含真实按下／抬起时间，长按不作确定判断。拼接只覆盖录像展示范围，控件状态可能来自不同时刻。</p><div id="events"></div></details>
<details><summary>查看任意原始帧（不自动增加页面节点）</summary><label>帧号<input type="number" id="frame-index" min="0" value="0"></label><button id="view-frame">查看原始帧</button><p id="frame-info"></p><img id="frame-image" alt="选定的原始证据帧"></details>
<script src="/annotations/video.js"></script></html>
