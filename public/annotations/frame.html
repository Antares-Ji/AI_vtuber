<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐图改框与逻辑关联</title>
<style>body{margin:0;background:#111827;color:#eee;font:14px system-ui}header{padding:14px}main{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:12px;padding:12px}.stage{position:relative;align-self:start}.stage img{width:100%;display:block}.box{position:absolute;border:2px solid #35ff9a;box-sizing:border-box;cursor:move;touch-action:none}.box.uncertain{border-color:#ffce50;border-style:dashed}.box.selected{border-color:white;box-shadow:0 0 0 2px #1b64ff}.tag{background:#073921;color:white;padding:1px 4px}.handle{position:absolute;bottom:-4px;right:-4px;background:white;width:12px;height:12px;cursor:nwse-resize}aside{position:sticky;top:10px;align-self:start;max-height:90vh;overflow:auto}button,input{font:inherit;margin:3px;padding:5px}input[type=number]{width:62px}#list button{display:block;width:95%;text-align:left}a{color:#93c5fd}</style>
<header><h2 id="page-title">正在预框…</h2><p>黄框是轮廓候选，不保证可交互或完整。拖动框移动，右下角缩放；可改名、补框、删框。更改自动保存本浏览器，完成后回多图页批量导出。</p><a href="/annotations/review.html">返回多图选择／批量导出</a></header>
<main><div class="stage" id="stage"><img alt="等待加载"><div id="boxes"></div></div><aside>
<label>本图页面名称<input id="page-label"></label><p id="selected"></p>
<label style="display:block;font-weight:bold" for="name">① 名称（可直接修改）</label><input id="name" aria-label="名称" style="width:95%;box-sizing:border-box" placeholder="先填OCR文字，你可以改名">
<label style="display:block;font-weight:bold" for="annotation-note">② 注释（可选）</label><textarea id="annotation-note" aria-label="注释" rows="4" style="width:95%;box-sizing:border-box;font:inherit" placeholder="例如：关闭后下方选项不可用"></textarea>
<div id="coords"></div><label><input id="uncertain" type="checkbox">待确认</label>
<p><label>点此框后到哪张图／什么状态<input id="next-image" placeholder="例如 frame-004.jpg 或声音关闭"></label></p>
<button id="ocr-labels">自动识别全部框文字</button><button id="add">补框</button><button id="remove">删除选中框</button><button id="export">导出本图JSON</button><p id="status"></p><div id="list"></div></aside></main><script type="module" src="/annotations/home-editor.js"></script></html>
