</style></head><body><main><p><a href="/">← 返回直播页</a></p><h1>直接 DeepSeek vs 双层架构</h1><p>同一问题分别请求一次。双层架构会根据复杂度选择本地千问或云端，并记录等待话术。</p><textarea id="prompt">请用两句话说明为什么流式交互能降低等待感。不要使用 Markdown。</textarea><br><button id="run">运行对比</button><span id="status"></span><section class="grid"><article class="card"><h2>直接 DeepSeek</h2><p class="metrics" id="directMetrics">等待测试</p><p class="reply" id="directReply"></p></article><article class="card"><h2>本地 + 云端双层</h2><p class="metrics" id="dualMetrics">等待测试</p><p class="preface" id="preface"></p><p class="reply" id="dualReply"></p></article></section><section class="card runtime"><h2>实时链路运行指标</h2><p id="runtimeNote">正在读取服务端指标…</p><div class="metric-grid" id="runtimeMetrics"></div><h3>模块状态</h3><div class="module-grid" id="moduleStatus"></div></section></main><script src="/latency.js"></script></body></html>
